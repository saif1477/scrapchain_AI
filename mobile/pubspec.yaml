name: scrapchain_ai
description: "ScrapChain AI — multimodal e-waste intelligence for kabadiwalas (SIH26229)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # On-device AI
  tflite_flutter: ^0.11.0
  camera: ^0.11.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.13.0   # acid-container label OCR
  # Voice-first UI
  speech_to_text: ^7.0.0                   # online STT; whisper.cpp FFI for offline
  flutter_tts: ^4.0.2
  # AR hazard overlays
  ar_flutter_plugin_flutterflow: ^0.7.0
  # Offline-first storage & sync
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.0
  # Networking / receipts
  http: ^1.2.0
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  geolocator: ^12.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/yolov8n_ewaste.tflite
    - assets/models/efficientnet_b0_material.tflite
    - assets/models/ewaste_labels.txt
