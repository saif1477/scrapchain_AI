Organizations:
  - &ScrapChainOrg
    Name: ScrapChainOrg
    ID: ScrapChainMSP
    MSPDir: crypto-config/peerOrganizations/scrapchain.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ScrapChainMSP.admin', 'ScrapChainMSP.peer', 'ScrapChainMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('ScrapChainMSP.admin', 'ScrapChainMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('ScrapChainMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ScrapChainMSP.peer')"
    AnchorPeers:
      - Host: peer0.scrapchain.org
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
    - *ScrapChainOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.scrapchain.org:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.scrapchain.org
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/scrapchain.org/orderers/orderer.scrapchain.org/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/scrapchain.org/orderers/orderer.scrapchain.org/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
    - *ScrapChainOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ScrapChainGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
    Consortiums:
      ScrapChainConsortium:
        Organizations:
          - *ScrapChainOrg
  ScrapChainChannel:
    Consortium: ScrapChainConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
